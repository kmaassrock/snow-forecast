name: Deploy site

# Publishes the site to GitHub Pages on every push, and every 3 hours rebuilds
# the data snapshots: resort reports, the widget summary, and the Upcoming Snow
# ranking (data/reports.json, summary.json, upcoming.json).
on:
  push:
    branches: [main]
  schedule:
    - cron: '15 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Read resort snow reports
        run: node scripts/reports.cjs
        continue-on-error: true
      - name: Build widget summary
        run: node scripts/summary.cjs
        env:
          WIDGET_RESORTS: ${{ vars.WIDGET_RESORTS }}
        # A forecast outage shouldn't block publishing; the widget keeps its last copy.
        continue-on-error: true
      - name: Rank upcoming snow at every resort
        run: node scripts/upcoming.cjs
        continue-on-error: true
      # Stamp asset links with this commit so a browser never pairs a new page
      # with older cached scripts or styles.
      - name: Version asset URLs
        run: sed -i "s/__V__/${GITHUB_SHA::7}/g" index.html widget.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4
