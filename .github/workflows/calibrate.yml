name: Recalibrate models

# Re-checks every model against station data so the corrections pick up each
# new winter. Runs monthly; commits data/calibration.json if it changed.
on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/calibrate.cjs
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/calibration.json
          git diff --cached --quiet || git commit -m "Update model calibration"
          git push
